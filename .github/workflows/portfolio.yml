name: Portfolio checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      - name: Build Medicare Part D panel
        run: python -m glp1_market.medicare
      - run: python run_pipeline.py
        env:
          GLP1_MEDICARE_DATA: .cache/medicare.json
      - name: Prepare public dashboard
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p public-dashboard
          cp outputs/dashboard.html public-dashboard/index.html
          cp outputs/medicare.json public-dashboard/medicare.json
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: public-dashboard
      - uses: actions/upload-artifact@v4
        with:
          name: glp1-market-lab
          path: outputs/
          if-no-files-found: error

  publish-dashboard:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@v4
