[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glp1-cross-market-analytics"
version = "1.0.0"
description = "Synthetic GLP-1 market dynamics, forecasting, and companion nutrition analytics."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3.0",
    "pandas>=2.1,<3.0",
    "matplotlib>=3.8,<4.0",
    "seaborn>=0.13,<1.0",
    "statsmodels>=0.14,<1.0",
    "scipy>=1.11,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
glp1_market = ["dashboard.html"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
